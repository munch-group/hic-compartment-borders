project:
  type: manuscript
  output-dir: ../_book/thesis

filters:
  - at: pre-quarto
    path: ../filters/abstract-section.lua
    # moves abstract section to meta data so it does not need
    # to to in metadata. Just put it in an "# Abstract" section    # same as any other section
  - at: post-quarto
    path: ../filters/captions.lua
    # moves subcaptions into the main caption

manuscript:
  article: index.qmd


format:
  html: default
  # docx: default
  #  jats: default

  # An arxiv style extension, but we need Latin Modern fonts downloaded
  # arxiv-pdf:
  #   keep-tex: true
  pdf:
    # filters:
    # # - at: pre-ast
    # #   path: filter1.lua
    #   - movesubcaptions.lua  
    # # latex-clean: false
    documentclass: scrbook
    pdf-engine: pdflatex
    papersize: A4
    toc: true
    toc-depth: 2
    toc-title: "Table of contents"
    lof: false
    lot: false
    fig-align: center
    geometry:
      - textheight=9in,
      - textwidth=6.5in,
      - top=1in,
      - headheight=14pt,
      - headsep=25pt,
      - footskip=30pt      
    fontsize: 10pt
    linestretch: 1.2   
    number-sections: true
    number-depth: 2    
    highlight-style: kate 
    tbl-cap-location: top
    code:
      code-block-bg: "#dedede"    
    include-in-header:
      - file: pdftheme/header_extra.tex
    template-partials:
      - pdftheme/before-body.tex      

notebook-links: false

lightbox: true

execute:
  freeze: false

bibliography: ../references.bib
